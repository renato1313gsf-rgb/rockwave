name: Import original RockWave logo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-rockwave-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify original logo
        run: |
          if [ -f rockwave-logo.png ]; then
            echo "The logo is already present."
            exit 0
          fi

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/renato1313gsf-rgb/Repositorio-rgb.github.io/main/rockwave-logo.png" \
            --output rockwave-logo.png

          python - <<'PY'
          from pathlib import Path
          data = Path("rockwave-logo.png").read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n"), "Downloaded file is not a valid PNG"
          assert len(data) > 1000, "Downloaded logo is unexpectedly small"
          print(f"Verified original PNG: {len(data):,} bytes")
          PY

      - name: Commit logo to this repository
        run: |
          if git ls-files --error-unmatch rockwave-logo.png >/dev/null 2>&1; then
            echo "The logo is already tracked."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rockwave-logo.png
          git commit -m "Add original RockWave logo"
          git push
